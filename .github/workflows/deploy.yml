name: Build and deploy Cercanias Moovit

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Bilbao GTFS files
        run: python scripts/build_gtfs.py --output-dir data

      - name: Commit refreshed schedules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json data/stations.json data/days
          if ! git diff --cached --quiet; then
            git commit -m "Update Bilbao GTFS schedules"
            # Integrate any schedule or code commit that reached main during the build.
            git pull --rebase origin main
            git push
          else
            echo "GTFS files have not changed."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}